services:
  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["atlas", "demo", "--cached"]
    volumes:
      - atlas-data:/app/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ATLAS_CORS: http://localhost:3000,http://127.0.0.1:3000
      ATLAS_WORKERS: "1"
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - atlas-data:/app/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  atlas-data:
