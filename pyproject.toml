[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-traffic"
version = "1.0.0"
description = "Video-derived traffic intelligence and reproducible signal control"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "numpy==2.4.6", "opencv-python==5.0.0.93", "scipy==1.17.1",
  "scikit-learn==1.9.1", "joblib==1.6.0", "prometheus-client==0.26.0",
  "psutil==7.2.2", "ultralytics==8.4.173", "lap==0.5.13", "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
media = ["imageio-ffmpeg==0.6.0"]
cities = ["eclipse-sumo==1.27.1", "traci==1.27.1", "sumolib==1.27.1", "pyproj==3.7.2"]
evaluation = ["trackeval==1.3.0", "pycocotools==2.0.11", "pandas==3.0.6", "tables==3.11.1", "eclipse-sumo==1.27.1", "traci==1.27.1", "pyproj==3.7.2"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
atlas = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
